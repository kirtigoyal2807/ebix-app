name: pilates_app
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.16+25

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.3
  bloc: ^8.1.1
  go_router: ^13.1.0
  intl: ^0.20.2
  shared_preferences: ^2.2.2
  google_fonts: ^6.1.0
  equatable: ^2.0.5
  flutter_svg: ^2.0.9
  country_code_picker: ^3.4.1
  flutter_rating_bar: ^4.0.1
  lottie: ^3.3.2
  dio: ^5.9.2
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0
  permission_handler: ^11.3.1
  geolocator: ^13.0.2
  html: ^0.15.5
  add_2_calendar: ^3.0.1
  flutter_html: ^3.0.0
  image_picker: ^1.1.2
  flutter_screenutil: ^5.9.3
  phone_numbers_parser: ^9.0.22
  share_plus: ^13.1.0
  connectivity_plus: ^6.1.4

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/images/svg/
    - assets/images/demo images/
    - assets/images/png/
    - assets/images/svg/account/
    - assets/images/svg/invoice_history/
    - assets/images/svg/explore/
    - assets/images/svg/goal/
    - assets/images/svg/progress_tracking/
    - assets/images/svg/challenges/
    - assets/json/

  fonts:
    - family: CoHeadline
      fonts:
        - asset: assets/fonts/CoHeadline-Regular.otf
        - asset: assets/fonts/CoHeadline-Light.otf
          weight: 500
        - asset: assets/fonts/CoHeadline-Bold.otf
          weight: 700