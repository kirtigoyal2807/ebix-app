name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - ci-cd

permissions:
  contents: read
  actions: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          channel: 'stable'
          cache: true
          
      - name: Verify Flutter and Dart versions
        run: |
          flutter --version
          dart --version
          
      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          
      - name: Verify Java version
        run: java -version
        
      - name: Get Flutter dependencies
        run: flutter pub get
        
      - name: Build debug APK
        run: flutter build apk --debug
        
      - name: Display APK information
        run: |
          APK_PATH=$(find build/app/outputs/flutter-apk -name "app-debug.apk" | head -1)
          if [ -f "$APK_PATH" ]; then
            echo "APK built successfully at: $APK_PATH"
            echo "APK size: $(du -h "$APK_PATH" | cut -f1)"
            echo "APK MD5: $(md5sum "$APK_PATH" | cut -d' ' -f1)"
          else
            echo "Error: APK file not found!"
            exit 1
          fi
          
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pilates-app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
          if-no-files-found: error